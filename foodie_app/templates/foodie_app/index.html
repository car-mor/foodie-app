{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<h3>Categorías Principales</h3>

<ul class="list-group">
    {% for category in categories %}
        <li class="list-group-item">
            <a href="{% url 'foodie_app:category_detail' category.id %}" class="text-decoration-none">
                <div class="d-flex justify-content-between align-items-center w-100 py-2">
                    <span class="fw-bold fs-5" style="color: #2196c8ff;">{{ category.name }}</span>
                    <span class="text-muted small">&rsaquo;</span>
                </div>
            </a>
        </li>
    {% empty %}
        <li class="list-group-item text-muted">No hay categorías disponibles.</li>
    {% endfor %}
</ul>
{% endblock content %}
