{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block extra_head %}
<style>
    /* Fondo suave */
    body {
        background-color: #f8fafc;
    }

    /* Tarjeta de Registro */
    .register-card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        overflow: hidden;
        background-color: white;
    }

    /* Encabezado Visual */
    .register-header {
        background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
        padding: 2.5rem 2rem 1.5rem;
        text-align: center;
        border-bottom: 1px solid #e2e8f0;
    }

    /* Icono */
    .icon-circle {
        width: 70px;
        height: 70px;
        background-color: white;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #2196c8;
        font-size: 2rem;
        box-shadow: 0 4px 15px rgba(33, 150, 200, 0.15);
        margin-bottom: 1rem;
    }

    .register-title {
        color: #0f172a;
        font-weight: 800;
        margin-bottom: 0.5rem;
    }

    /* Botón */
    .btn-register {
        background-color: #2196c8;
        border: none;
        padding: 0.8rem;
        font-weight: 600;
        border-radius: 10px;
        width: 100%;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(33, 150, 200, 0.2);
    }
    
    .btn-register:hover {
        background-color: #1a7ca8;
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(33, 150, 200, 0.3);
    }

    /* Footer */
    .register-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: #64748b;
        padding-top: 1rem;
        border-top: 1px solid #f1f5f9;
    }
    
    .register-footer a {
        color: #2196c8;
        text-decoration: none;
        font-weight: 600;
    }
    
    .register-footer a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">
            
            <div class="card register-card">
                
                <div class="register-header">
                    <div class="icon-circle">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="register-title">Únete a Foodie</h3>
                    <p class="text-muted mb-0">Crea tu cuenta y empieza a cocinar</p>
                </div>

                <div class="card-body p-4 pt-4">
                    
                    <form action="{% url 'accounts:register' %}" method="post">
                        {% csrf_token %}
                        
                        {% bootstrap_form form %}
                        
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-register">
                                Crear Cuenta <i class="bi bi-arrow-right-short ms-1"></i>
                            </button>
                        </div>
                    </form>

                    <div class="register-footer">
                        <p class="mb-0">
                            ¿Ya tienes una cuenta? 
                            <a href="{% url 'accounts:login' %}">Inicia sesión aquí</a>
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock content %}
