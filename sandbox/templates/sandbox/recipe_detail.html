{% extends "base.html" %}
{% block content %}
{% if recipe %}
<article>
    <h1>{{ recipe.title }}</h1>
    <p>Descripción: {{ recipe.description }}</p>
    <p>Ingredientes:</p>
    <ul>
       {{ recipe.ingredients }}
    </ul>
    <p>Instrucciones:</p>
    <ol>
         {{ recipe.directions }}
    </ol>
</article>
{% else %}
    <p>Receta no encontrada.</p>
{% endif %}


{% endblock content %}
